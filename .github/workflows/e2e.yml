name: E2E

# The built extension in real Chromium, on fixture pages served at the chat
# hosts with a local mock provider. Deterministic; no network or accounts.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Chrome extension
        run: pnpm build:chrome

      - name: Install Playwright Chromium
        run: pnpm -C apps/extension exec playwright install --with-deps chromium

      - name: Run extension E2E tests
        run: pnpm -C apps/extension e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/extension/playwright-report
            apps/extension/test-results
          retention-days: 14
