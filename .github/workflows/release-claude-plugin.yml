name: Release Claude plugin

on:
  push:
    tags:
      - "claude-plugin-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check the core copies match packages/core
        run: node scripts/sync-claude-plugin.mjs --check

      - name: Check the tag matches the plugin version
        run: |
          version=$(node -p "require('./apps/claude-plugin/.claude-plugin/plugin.json').version")
          if [ "${GITHUB_REF_NAME}" != "claude-plugin-v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match plugin.json version ${version}" >&2
            exit 1
          fi

      - name: Package plenz.plugin
        run: |
          cd apps/claude-plugin
          zip -r ../../plenz.plugin . -x ".claude-plugin/types/*"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" plenz.plugin \
            --title "plenz for Claude Code ${GITHUB_REF_NAME#claude-plugin-v}" \
            --notes "Install from the marketplace with \`/plugin install plenz --marketplace i-see-pixels/plenz\`, or download plenz.plugin below. See apps/claude-plugin/README.md."
